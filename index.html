<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>AER.wave — Beyond the forecast</title>
    <meta
      name="description"
      content="AER.wave — адаптивный погодный сервис с прогнозом на 16 дней, качеством воздуха и интерактивной картой."
    />
    <meta name="theme-color" content="#08060b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="AER.wave" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@500;600;700;800&family=Onest:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-dayphase="night" data-weather="clear">
    <div class="aer-atmosphere" aria-hidden="true"></div>
    <canvas id="weather-canvas" aria-hidden="true"></canvas>
    <div id="cursor-glow" class="aer-cursor-glow" aria-hidden="true"></div>

    <!-- Fixed Flush-Left Sidebar (Desktop & Tablet) -->
    <aside id="sidebar" class="sidebar glass-panel" aria-label="Боковая навигация"></aside>

    <!-- Main App Shell -->
    <div id="app-shell" class="app-shell">
      <div class="shell-inner">
        <header id="topbar" class="topbar glass-panel"></header>
        <div id="status-banners" class="status-banners"></div>
        <main id="main-content" class="main-content"></main>
        <footer id="app-footer" class="app-footer glass-panel aer-top-accent"></footer>
      </div>
    </div>

    <!-- Mobile Flush Bottom Dock -->
    <nav id="mobile-dock" class="mobile-dock glass-panel-elevated" aria-label="Мобильная навигация"></nav>

    <!-- Redesigned Opaque Scroll-Locked Mobile Menu Drawer -->
    <div
      id="mobile-drawer"
      class="mobile-drawer"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
      hidden
    ></div>

    <!-- iOS PWA Guide Modal -->
    <div id="ios-modal" class="ios-modal" hidden></div>

    <!-- Scroll-to-Top Floating Button -->
    <button id="scroll-top-btn" class="scroll-top-btn" type="button" aria-label="Наверх" hidden></button>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
